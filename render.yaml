databases:
  - name: sazon-db
    databaseName: sazon_del_vic
    user: sazon
    plan: free

services:
  - type: web
    name: sazon-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && flask db upgrade
    startCommand: gunicorn --worker-class eventlet -w 1 --bind 0.0.0.0:$PORT run:app
    plan: starter
    envVars:
      - key: FLASK_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: sazon-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: GOOGLE_PLACES_KEY
        sync: false
      - key: META_API_TOKEN
        sync: false
      - key: META_PHONE_NUMBER_ID
        sync: false

  - type: web
    name: sazon-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    plan: free
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
